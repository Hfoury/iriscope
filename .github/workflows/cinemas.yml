name: Salles de cinéma (CNC)
# Une fois par mois (et à la demande) : la liste officielle des salles de cinéma du CNC (Licence Ouverte), publiée sur la branche « cinemas ».
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:
    inputs:
      explorer:
        description: Afficher seulement les jeux de données (oui/non)
        default: 'non'
      contacts:
        description: Départements où chercher les contacts des salles indépendantes (ex. 29,56), vide sinon
        default: ''
permissions:
  contents: write
jobs:
  cinemas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save xlsx@0.18.5
      - name: Exploration
        if: inputs.explorer == 'oui'
        run: node outils/cinemas.mjs --explore
      - name: Liste des salles
        if: inputs.explorer != 'oui' && inputs.contacts == ''
        run: node outils/cinemas.mjs sortie
      - name: Publication sur la branche cinemas
        if: inputs.explorer != 'oui' && inputs.contacts == ''
        run: |
          cd sortie
          git init -q -b cinemas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Salles de cinéma du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cinemas
      - name: Contacts des salles indépendantes
        if: inputs.contacts != ''
        run: node outils/cinemas-contacts.mjs "${{ inputs.contacts }}"
