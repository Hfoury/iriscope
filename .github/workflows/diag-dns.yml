name: Diagnostic domaine des mails
# Manuel uniquement : lit les enregistrements publics du domaine d'envoi. Ne publie rien.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node outils/diag-dns.mjs
