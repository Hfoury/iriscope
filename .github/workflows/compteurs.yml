name: Compteurs des sorties

# Toutes les 3 heures : regroupe les « ça m’intéresse » et « j’y vais » envoyés depuis l’appli et les publie sur la branche « compteurs ».
# Gratuit, sans clé. Les messages ntfy ne sont gardés que 12 heures : ce passage régulier les rend durables.
on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compteurs
  cancel-in-progress: false

jobs:
  compteurs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compteurs déjà regroupés
        run: |
          if git fetch -q --depth=1 origin compteurs 2>/dev/null; then git show FETCH_HEAD:compteurs/index.json > ancien.json || echo '{}' > ancien.json; else echo '{}' > ancien.json; fi
      - name: Regroupement
        run: node outils/compteurs.mjs sortie --ancien ancien.json
      - name: Publication sur la branche compteurs
        run: |
          cd sortie
          git init -q -b compteurs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Compteurs du $(date -u +%F\ %H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" compteurs
