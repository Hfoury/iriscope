name: Publier la version web
on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
# 21 nov 2026 : préparation et mise en ligne en deux tâches séparées. Dans une seule tâche, la mise en ligne
# démarrait parfois avant que GitHub ait enregistré le paquet (« No artifacts named github-pages »), et la relancer
# créait un 2e paquet (« Multiple artifacts »). Séparées, la mise en ligne attend la fin de la préparation et peut se relancer seule.
jobs:
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompresser le zip le plus recent
        run: |
          ZIP=$(ls veille-web-[0-9]*.zip | sort -V | tail -n 1)
          mkdir site && unzip -q "$ZIP" -d site
          test -f site/index.html
          # projet bis (autre visuel, à l'essai) : publié à part sur /iriscope/bis/ s'il est déposé
          BIS=$(ls veille-web-bis-*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$BIS" ]; then mkdir -p site/bis && unzip -q "$BIS" -d site/bis && test -f site/bis/index.html; fi
          # page de présentation pour les salles (23 nov 2026) : publiée sur /iriscope/salles/
          if [ -d salles ]; then mkdir -p site/salles && cp -r salles/. site/salles/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publier:
    needs: preparer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
