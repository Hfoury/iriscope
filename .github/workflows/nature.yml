name: Nature (spots du coin et terrain des zones)

# Chaque nuit : lit les extraits OpenStreetMap de Geofabrik (régions de France métropolitaine, Corse et outre-mer, ODbL), garde les spots
# (points de vue, monuments, phares, plages, aires de jeux…) et ce qui décrit le terrain (mer, lac, rivière, forêt),
# et publie des tuiles sur la branche « nature » (lue par l'appli). Plus besoin des serveurs Overpass, souvent saturés.
# Une tâche par région (le fichier France entier, 4,5 Go, se télécharge trop lentement), puis une tâche qui assemble.
# Gratuit, sans clé (dépôt public : minutes Actions illimitées).
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nature
  cancel-in-progress: true

jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        r: [alsace, aquitaine, auvergne, basse-normandie, bourgogne, bretagne, centre, champagne-ardenne, corse, franche-comte,
            haute-normandie, ile-de-france, languedoc-roussillon, limousin, lorraine, midi-pyrenees, nord-pas-de-calais,
            pays-de-la-loire, picardie, poitou-charentes, provence-alpes-cote-d-azur, rhone-alpes,
            guadeloupe, guyane, martinique, mayotte, reunion]
    steps:
      - name: Outil osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Téléchargement et filtrage
        run: |
          set -e
          n=${{ matrix.r }}
          for k in 1 2 3; do
            curl -fsSL --retry 3 -A "iriscope-nature/1.0 (+https://hfoury.github.io/iriscope/)" -o "$n.osm.pbf" "https://download.geofabrik.de/europe/france/$n-latest.osm.pbf" && break
            sleep 30
          done
          echo "$n : $(du -h "$n.osm.pbf" | cut -f1)"
          osmium tags-filter -O -o "$n-f.osm.pbf" "$n.osm.pbf" \
            nwr/tourism=viewpoint,attraction,picnic_site nwr/historic nwr/man_made=lighthouse \
            nwr/natural=peak,waterfall,cape,arch,beach,wood nwr/natural=water nwr/waterway=river \
            nwr/leisure=bathing_place,playground,horse_riding,fitness_station,fishing,marina nwr/sport nwr/rental \
            nwr/harbour nwr/seamark:type nwr/landuse=forest
          osmium export -O -f geojsonseq -a type,id -o "$n.geojsonseq" "$n-f.osm.pbf"
          gzip -9 "$n.geojsonseq"
          echo "$n : $(zcat "$n.geojsonseq.gz" | wc -l) objets"
      - uses: actions/upload-artifact@v4
        with:
          name: nature-${{ matrix.r }}
          path: ${{ matrix.r }}.geojsonseq.gz
          retention-days: 1

  assemblage:
    needs: region
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: nature-*
          merge-multiple: true
          path: regions
      - name: Tuiles
        run: |
          ls -la regions
          for f in regions/*.gz; do gunzip "$f"; done
          node --max-old-space-size=6144 outils/nature.mjs sortie regions/*.geojsonseq
      - name: Publication sur la branche nature
        run: |
          cd sortie
          git init -q -b nature
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Nature du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nature
