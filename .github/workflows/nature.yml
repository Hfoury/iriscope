name: Nature (spots du coin et terrain des zones)

# Chaque nuit : lit les extraits OpenStreetMap de Geofabrik (France métropolitaine et outre-mer, ODbL), garde les spots
# (points de vue, monuments, phares, plages, aires de jeux…) et ce qui décrit le terrain (mer, lac, rivière, forêt),
# et publie des tuiles sur la branche « nature » (lue par l'appli). Plus besoin des serveurs Overpass, souvent saturés.
# Gratuit, sans clé (dépôt public : minutes Actions illimitées).
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
    inputs:
      regions:
        description: "Extraits Geofabrik (chemins séparés par des espaces), pour un essai : europe/france/bretagne"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nature
  cancel-in-progress: true

jobs:
  nature:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outil osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Téléchargement et filtrage
        env:
          REGIONS: ${{ github.event.inputs.regions }}
        run: |
          set -e
          R="${REGIONS:-europe/france central-america/guadeloupe central-america/martinique south-america/guyane africa/reunion africa/mayotte}"
          for r in $R; do
            n=$(basename "$r")
            ok=0
            for u in "https://download.geofabrik.de/$r-latest.osm.pbf" "https://download.geofabrik.de/europe/france/$n-latest.osm.pbf"; do
              if curl -fsSL -A "iriscope-nature/1.0 (+https://hfoury.github.io/iriscope/)" -o "$n.osm.pbf" "$u"; then ok=1; echo "$n : $u ($(du -h "$n.osm.pbf" | cut -f1))"; break; fi
            done
            [ $ok = 1 ] || { echo "::warning::$n introuvable"; continue; }
            osmium tags-filter -O -o "$n-f.osm.pbf" "$n.osm.pbf" \
              nwr/tourism=viewpoint,attraction,picnic_site nwr/historic nwr/man_made=lighthouse \
              nwr/natural=peak,waterfall,cape,arch,beach,wood nwr/natural=water nwr/waterway=river \
              nwr/leisure=bathing_place,playground,horse_riding,fitness_station,fishing,marina nwr/sport nwr/rental \
              nwr/harbour nwr/seamark:type nwr/landuse=forest
            rm -f "$n.osm.pbf"
            osmium export -O -f geojsonseq -a type,id -o "$n.geojsonseq" "$n-f.osm.pbf"
            rm -f "$n-f.osm.pbf"
            echo "$n : $(wc -l < "$n.geojsonseq") objets"
          done
      - name: Tuiles
        run: node --max-old-space-size=6144 outils/nature.mjs sortie *.geojsonseq
      - name: Publication sur la branche nature
        run: |
          cd sortie
          git init -q -b nature
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Nature du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nature
