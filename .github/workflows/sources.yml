name: Chef des sources

# Chaque nuit, après la collecte DATAtourisme : note les sources d'événements tuile par tuile, repère ce que chacune
# apporte en propre, surveille les pannes, et publie ses choix sur la branche « sources » (lue par l'appli).
# Le lundi : cherche aussi de nouveaux agendas ouverts sur data.gouv.fr et ouvre un ticket s'il en trouve.
# Gratuit, sans clé, ne publie que des données.
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      decouverte:
        description: 'Chercher aussi de nouvelles sources sur data.gouv.fr'
        type: boolean
        default: true
      max:
        description: 'Nombre de sites publics à visiter'
        default: '800'
      europe:
        description: 'Chercher aussi en Europe (data.europa.eu)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sources
  cancel-in-progress: true

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: donnees
          path: donnees
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Etat de la veille
        run: curl -sfL -o ancien.json "https://raw.githubusercontent.com/${{ github.repository }}/sources/sources/etat.json" || echo '{}' > ancien.json
      - name: Notation
        run: node outils/sources.mjs sortie donnees ancien.json ${{ github.event.inputs.decouverte == 'true' && '--decouverte' || '' }}
      # 21 nov 2026 : découverte automatique depuis l'annuaire officiel (sites des mairies, intercos, préfectures) et data.europa.eu
      - name: Decouverte des agendas publics
        continue-on-error: true
        run: |
          curl -sfL -o ancien-decouverte.json "https://raw.githubusercontent.com/${{ github.repository }}/sources/sources/decouverte.json" || echo '{}' > ancien-decouverte.json
          curl -sfL -o /tmp/annuaire.tar.bz2 https://lecomarquage.service-public.gouv.fr/donnees_locales_v4/all_latest.tar.bz2
          mkdir -p /tmp/annuaire && tar xjf /tmp/annuaire.tar.bz2 -C /tmp/annuaire --wildcards '*local.json'
          node outils/decouverte.mjs "$(ls /tmp/annuaire/*local.json | head -n 1)" sortie ancien-decouverte.json --max=${{ github.event.inputs.max || '800' }} ${{ github.event.inputs.europe == 'true' && '--europe' || '' }}
          cat sortie/sources/decouverte.md >> sortie/sources/rapport.md
      # 24 nov 2026 (Hervé) : offices de tourisme (DATAtourisme), proposés avant les mairies dans « Agendas des mairies »
      - name: Offices de tourisme
        continue-on-error: true
        env:
          DATATOURISME_KEY: ${{ secrets.DATATOURISME_KEY }}
        run: node outils/offices.mjs sortie
      - name: Publication sur la branche sources
        run: |
          cp sortie/nouveaux.md nouveaux.md && rm sortie/nouveaux.md
          cd sortie
          git init -q -b sources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bilan des sources du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sources
      - name: Ticket si nouvelles sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s nouveaux.md ]; then
            gh issue create -R "${{ github.repository }}" --title "Nouvelles sources d'événements repérées ($(date -u +%F))" --body-file nouveaux.md
          fi
