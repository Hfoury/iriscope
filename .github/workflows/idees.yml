name: Boîte à idées

# Toutes les 3 heures (0.66.0) : regroupe les idées, les appuis et les décisions du responsable envoyés depuis l'appli et les publie sur la branche « idees ».
# Gratuit, sans clé. Les messages ntfy ne sont gardés que 12 heures : ce passage régulier les rend durables.
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idees
  cancel-in-progress: false

jobs:
  idees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: État précédent
        run: |
          if git fetch -q --depth=1 origin idees 2>/dev/null; then git show FETCH_HEAD:idees/etat.json > ancien.json || echo '{}' > ancien.json; else echo '{}' > ancien.json; fi
      - name: Regroupement
        run: node outils/idees.mjs sortie --ancien ancien.json
      - name: Publication sur la branche idees
        run: |
          cd sortie
          git init -q -b idees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Idées du $(date -u +%F\ %H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" idees
